# Replace YOUR_DOMAIN with the real hostname (e.g. maker.volyx.xyz).
# Obtain TLS certs (certbot) then enable the HTTPS server block below.
# Traffic flow: client → nginx :443 → Next.js :4084 → /api/* proxy → Nest :3011
#
# ⚠️ PORT ALIGNMENT — these values must match or nginx returns 502:
#   deploy/nginx.maker.conf  upstream maker_web  → 127.0.0.1:4084
#   Apps/web/.env(.local)    WEB_PORT            → 4084   (Next listens here)
#   Apps/web/.env(.local)    INTERNAL_API_ORIGIN → http://127.0.0.1:3011
#   Apps/api/.env            PORT                → 3011
#
# 3011/4084 are the project defaults baked into the code and scripts
# (Apps/web/scripts/start-standalone.js, scripts/run-stack.js, lib/api.ts).
# Verify a deployment with: npm run preflight

upstream maker_web {
  server 127.0.0.1:4084;
  keepalive 32;
}

server {
  listen 80;
  server_name YOUR_DOMAIN;

  # Redirect all HTTP to HTTPS once certificates exist.
  # location / {
  #   return 301 https://$host$request_uri;
  # }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

  location /_next/static/ {
    proxy_pass http://maker_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://maker_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}

